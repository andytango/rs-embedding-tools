[package]
name = "embedding-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding processing tools with dimensionality reduction and clustering for WASM and Node.js"
keywords = ["wasm", "nodejs", "embeddings", "clustering", "dimensionality-reduction"]
categories = ["wasm", "algorithms", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:getrandom"]

[dependencies]
pacmap = { path = "../pacmap" }
hdbscan = { path = "../hdbscan" }
ndarray = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Node.js N-API dependencies (default)
napi = { version = "2", optional = true }
napi-derive = { version = "2", optional = true }

# WASM dependencies (optional)
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[build-dependencies]
napi-build = "2"

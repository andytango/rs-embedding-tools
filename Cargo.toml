[workspace]
members = [
    "crates/hdbscan",
    "crates/pacmap",
    "crates/embedding-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/scanner-embeddings"

[workspace.dependencies]
ndarray = "0.16"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For WASM support
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }

# Dev dependencies
proptest = "1.4"
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true